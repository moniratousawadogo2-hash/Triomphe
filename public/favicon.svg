<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2.5" />
  <!-- Central Emblem: Chef/Crown & Crossed Utensils -->
  <g transform="translate(50, 50) scale(0.9)">
    <!-- Arch / Crown of Triomphe -->
    <path d="M-22,-18 C-22,-30 22,-30 22,-18 L20,-8 L-20,-8 Z" fill="url(#goldGrad)" />
    <circle cx="-14" cy="-24" r="3" fill="#fef3c7" />
    <circle cx="0" cy="-28" r="3.5" fill="#fef3c7" />
    <circle cx="14" cy="-24" r="3" fill="#fef3c7" />
    <!-- Crossed Fork & Spoon / Knife -->
    <!-- Fork -->
    <g transform="rotate(-35)">
      <rect x="-2" y="-12" width="4" height="34" rx="2" fill="url(#goldGrad)" />
      <!-- tines -->
      <path d="M-6,-12 C-6,-22 6,-22 6,-12 L4,-12 C4,-18 -4,-18 -4,-12 Z" fill="url(#goldGrad)" />
      <rect x="-1" y="-20" width="2" height="9" fill="url(#goldGrad)" />
    </g>
    <!-- Spoon/Knife -->
    <g transform="rotate(35)">
      <rect x="-2" y="-12" width="4" height="34" rx="2" fill="url(#goldGrad)" />
      <path d="M0,-24 C5,-24 7,-17 4,-11 L-4,-11 C-7,-17 -5,-24 0,-24 Z" fill="url(#goldGrad)" />
    </g>
    <!-- Center gem -->
    <circle cx="0" cy="5" r="4.5" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5" />
  </g>
</svg>
