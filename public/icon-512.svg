<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="60%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background with rounded corners / maskable safe area -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#f59e0b" stroke-width="8" />
  <!-- Central Emblem -->
  <g transform="translate(256, 256) scale(4.5)" filter="url(#glow512)">
    <!-- Arch / Crown of Triomphe -->
    <path d="M-22,-18 C-22,-30 22,-30 22,-18 L20,-8 L-20,-8 Z" fill="url(#goldGrad512)" />
    <circle cx="-14" cy="-24" r="3" fill="#fffbeb" />
    <circle cx="0" cy="-28" r="3.5" fill="#fffbeb" />
    <circle cx="14" cy="-24" r="3" fill="#fffbeb" />
    <!-- Crossed Fork & Spoon / Knife -->
    <g transform="rotate(-35)">
      <rect x="-2" y="-12" width="4" height="34" rx="2" fill="url(#goldGrad512)" />
      <path d="M-6,-12 C-6,-22 6,-22 6,-12 L4,-12 C4,-18 -4,-18 -4,-12 Z" fill="url(#goldGrad512)" />
      <rect x="-1" y="-20" width="2" height="9" fill="url(#goldGrad512)" />
    </g>
    <g transform="rotate(35)">
      <rect x="-2" y="-12" width="4" height="34" rx="2" fill="url(#goldGrad512)" />
      <path d="M0,-24 C5,-24 7,-17 4,-11 L-4,-11 C-7,-17 -5,-24 0,-24 Z" fill="url(#goldGrad512)" />
    </g>
    <circle cx="0" cy="5" r="4.5" fill="#1c1917" stroke="#fbbf24" stroke-width="1.5" />
  </g>
</svg>
